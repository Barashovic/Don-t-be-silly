.team-card { text-align: center; }
.avatar {
  width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 1.25rem; margin: 0 auto 10px; font-family: var(--font-display);
}

/* ---------- footer ---------- */
footer.site-footer {
  background: var(--navy); color: rgba(255,255,255,0.75);
  padding: 40px 0 26px; text-align: center; font-size: 0.85rem;
}
footer.site-footer .foot-brand { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom: 14px; }
footer.site-footer .foot-brand img { height: 26px; border-radius: 6px; }
footer.site-footer button.link-btn { background: none; border: none; color: rgba(255,255,255,0.75); text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
footer.site-footer button.link-btn:hover { color: #fff; }

/* status badges */
.status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.status-badge.not-started { background: #EFEDF7; color: #5B6688; }
.status-badge.in-progress { background: #FFF1D0; color: #8A6300; }
.status-badge.done { background: #DAF3E7; color: #0E7A4E; }

table.tracker-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.tracker-table th, table.tracker-table td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.tracker-table th { color: var(--ink-soft); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
table.tracker-table select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border-strong); }

.gate-box { max-width: 380px; margin: 60px auto; text-align: center; }
.gate-box input { width: 100%; padding: 11px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-strong); font: inherit; margin: 12px 0; }
.gate-warning { font-size: 0.78rem; color: var(--ink-faint); margin-top: 16px; }

/* ---------- creative gallery / posters ---------- */
.poster-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px; }
.poster-card { border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border); background: var(--card); transition: transform .3s ease, box-shadow .3s ease; }
.poster-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.poster-media { position: relative; overflow: hidden; cursor: zoom-in; background: var(--navy); }
.poster-media img { width: 100%; display: block; transition: transform .4s ease; }
.poster-media:hover img { transform: scale(1.04); }
.poster-media .zoom-hint {
  position: absolute; bottom: 12px; right: 12px; background: rgba(43,58,94,0.75); color: #fff;
  font-size: 0.72rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; opacity: 0; transition: opacity .2s ease;
}
.poster-media:hover .zoom-hint { opacity: 1; }
.poster-body { padding: 20px 22px 24px; }
.poster-body .tag { margin-bottom: 8px; }
.poster-body h3 { margin-bottom: 6px; font-size: 1.08rem; }
.poster-body p { margin-bottom: 0; color: var(--ink-soft); font-size: 0.92rem; }

.lightbox { position: fixed; inset: 0; z-index: 150; display: none; align-items: center; justify-content: center; padding: 24px; }
.lightbox[data-open="true"] { display: flex; }
.lightbox .scrim { position: absolute; inset: 0; background: rgba(20,24,40,0.86); animation: fadein .2s ease; }
.lightbox .lb-content { position: relative; z-index: 2; max-width: min(90vw, 620px); max-height: 88vh; animation: popin .22s ease; }
.lightbox img { max-height: 78vh; width: auto; margin: 0 auto; border-radius: 14px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.lightbox figcaption { color: #fff; text-align: center; margin-top: 14px; font-size: 0.9rem; opacity: 0.85; }
.lightbox .lb-close, .lightbox .lb-nav {
  position: absolute; background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.3);
  border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 1.1rem; transition: background .15s ease;
}
.lightbox .lb-close:hover, .lightbox .lb-nav:hover { background: rgba(255,255,255,0.25); }
.lightbox .lb-close { top: -54px; right: 0; }
.lightbox .lb-prev { left: -60px; top: 50%; transform: translateY(-50%); }
.lightbox .lb-next { right: -60px; top: 50%; transform: translateY(-50%); }
@media (max-width: 720px) { .lightbox .lb-prev, .lightbox .lb-next { display: none; } }
@keyframes popin { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }

.evidence-quote { border-left: 4px solid var(--purple); padding: 4px 0 4px 18px; margin: 0 0 18px; color: var(--ink-soft); font-style: italic; }

@media (max-width: 760px) {
  .hero-grid { grid-template-columns: 1fr; }
  .hero-illustration-wrap { max-width: 320px; margin: 0 auto; }
  .section { padding: 52px 0; }
}
</style>

  home: {
    kicker: "A University of Sheffield public health campaign",
    title: "Don't Be Silly, Wrap Your Willy.",
    tagline: "Most teenage-pregnancy campaigns talk to girls. We built one that talks to teenage boys instead — bluntly, honestly, and with a free way to actually do something about it.",
    ctaPrimaryLabel: "Why we built this",
    ctaPrimaryTarget: "issue",
    ctaSecondaryLabel: "See the campaign",
    ctaSecondaryTarget: "creative",
    highlights: [
      { label: "Under-18 conception rate — Firth Park", value: "35", sub: "per 1,000 women aged 15–17" },
      { label: "Under-18 conception rate — Fulwood", value: "5", sub: "per 1,000 women aged 15–17" },
      { label: "The gap between them", value: "7×", sub: "Firth Park vs Fulwood, same city" }
    ],
    intro: [
      "Teenage pregnancy rates vary hugely even within the same city — largely because of differences in deprivation, school engagement, and access to sexual health services between neighbourhoods. Firth Park and Fulwood, two Sheffield wards a few miles apart, sit at opposite ends of that gap.",
      "Almost every existing campaign responds to that gap by talking to girls. We think that misses half the conversation — so we built \"Don't Be Silly, Wrap Your Willy\": a poster, social and free-condom-delivery campaign aimed squarely at teenage boys, grounded in the local evidence on this page."
    ]
  },

  issue: {
    kicker: "The evidence",
    title: "Why we're targeting Firth Park — and why boys",

    ukPicture: {
      heading: "The UK picture",
      body: [
        "Nationally, under-18 conception rates in England and Wales have fallen for well over a decade — from 30.9 per 1,000 women aged under 18 in 2011 to 13.2 per 1,000 in 2021, a fall of more than half CITE:ons2021. That builds on England's ten-year Teenage Pregnancy Strategy (1999–2010), which combined better relationships and sex education, easier access to contraception, communications campaigns and support for young parents to cut the under-18 rate by 51% from its 1998 baseline. By 2023 the rate for women under 20 stood at 28.0 per 1,000 — still below pre-pandemic levels CITE:ons2023.",
        "But a falling national average hides a widening local gap, and it hides that the response has mostly been designed around girls and young women. Both of those blind spots are what this project responds to."
      ]
    },

    body: [
      "Our starting point is a local comparison from our assessment brief: the under-18 conception rate in Firth Park is 35 per 1,000, compared to just 5 per 1,000 in Fulwood — a sevenfold difference within the same city CITE:uos2026. Sheffield's own reporting shows this gap is not new: ward-level data from 2009–2011 already placed Firth Park among the city's highest-rate wards and Fulwood among its lowest, with the whole-city average sitting between the two CITE:sheffneeds.",
      "This isn't about any one cause. National and local data consistently link higher teenage conception rates to deprivation, school engagement, and access to sexual health education and services — not to any single explanation CITE:sheffreducing."

    factors: {
      heading: "What the evidence links to the gap",
      points: [
        "School absence and slower academic progress between ages 11–14 are individually associated with a higher likelihood of pregnancy before 18, alongside eligibility for free school meals, being a looked-after child, and alcohol use CITE:sheffneeds CITE:sheffreducing.",
        "Reduced access to further education and employment opportunities, and demographic/attitudinal differences between wards, are cited alongside deprivation as contributing factors — not as a single root cause CITE:sheffreducing.",
        "Nationally and locally, improved contraceptive use has consistently been identified as the factor with the single greatest effect on reducing teenage pregnancy rates CITE:phecondom — which is the main reason our own intervention (next tab) is built around making contraception genuinely easy to get, not just easy to read about."

  campaign: {
    kicker: "Our project",
    title: "The \"Don't Be Silly, Wrap Your Willy\" campaign",
    intro: "Designed for a University of Sheffield public health assessment: a creative, evidence-informed concept rather than a commissioned or funded NHS service. Where that matters — like the free condom delivery below — we've said so plainly.",

    whatWorks: {
      heading: "What actually works?",
      intro: "Three bodies of evidence shaped the design, not just the topic:",
      points: [
        "Skill-building, peer-led and school-based prevention programmes are generally the most effective at improving contraceptive knowledge and use and delaying sexual debut; information-only, counselling-only and abstinence-focused programmes show weaker or mixed results CITE:chin2016. That's a direct argument against a static, facts-only poster — ours needed to be a gateway to something more active.",
        "There is evidence that multi-component interventions — combining several channels rather than one — reduce teen pregnancy and unprotected intercourse more effectively than any single channel alone, although effects tend to be stronger for female participants than male, which is itself part of why we chose to focus specifically on boys CITE:chr2024.",
        "Effective prevention of repeat and rapid-repeat pregnancy links adolescent-friendly clinical contraceptive services with non-clinical support — awareness tools work best when they visibly connect to a real clinical pathway, not when they operate in isolation from one CITE:ghsp2018."
      ]
    },

    evidenceTable: {
      heading: "What works locally, specifically for Firth Park",
      rows: [
        {
          type: "Comprehensive sex education in schools",
          effectiveness: "Improves knowledge and is already part of the curriculum, but Firth Park faces real barriers to consistent delivery, and it's an open question whether it's tackled early or seriously enough on its own.",
          sources: "sheffreducing, rshegov"
        },
        {
          type: "Youth sexual health clinics",
          effectiveness: "Sheffield's Youth Clinic already runs in both S5 and S10, so it's technically accessible to Firth Park and Fulwood alike — but more provision specifically inside deprived areas is what the evidence points to next.",
          sources: "shsyouth"
        },
        {
          type: "School-based drop-in provision",
          effectiveness: "A weekly health and sexual health drop-in already runs at Firth Park School, in partnership with Sheffield Futures, school staff, pupils and parents — a model now in place at fourteen Sheffield secondary schools.",
          sources: "sheffreducing"
        }
      ]
    },

    theory: {
      heading: "Our model: Health Belief Model + Theory of Planned Behaviour",
      body: "We designed the campaign around the Health Belief Model, on the basis that a teenage boy is more likely to use contraception if he believes he is genuinely vulnerable to teenage pregnancy, that it carries serious consequences, that using contraception meaningfully reduces that risk, and that the practical barriers to using it are manageable CITE:hbm1974. We layered in the Theory of Planned Behaviour on top of that: if the campaign itself becomes something boys talk about because it's memorable and funny, using condoms starts to look like the normal, expected thing among their peers — a shift in subjective norm, not just individual belief CITE:tpb1991.",
      components: [
        { name: "Perceived susceptibility & severity", detail: "Statistics-led messaging makes the risk and its consequences feel personal, not abstract — the cost of raising a child, local conception rates, what actually changes about your life." },
        { name: "Perceived barriers", detail: "Free, genuinely discreet condom delivery removes the practical and social barrier of having to ask for or buy them in person." },
        { name: "Subjective norm (TPB)", detail: "A deliberately shareable, funny campaign gets talked about — so using condoms starts to look like what your mates already do, not an exception." }
      ]
    },

    proposal: {
      heading: "The initiative: free, discreet, and made for teenage boys",
      summary: "A campaign that pairs peer-relevant, funny-but-serious messaging with a genuinely free and discreet condom delivery service — backed by two poster designs and a targeted social media presence, and built to sit alongside real clinical services rather than replace them.",
      who: "Teenage boys aged roughly 13–19 across Sheffield — a group most existing teen-pregnancy campaigns don't speak to directly — with posters and ads concentrated in Firth Park's schools, colleges, youth centres, clubs and pubs first.",
      aim: "To make using contraception feel like the obvious, low-barrier choice for teenage boys — not something 'the girl sorts out' — by pairing honest information about the consequences of teenage pregnancy with a service that removes the awkwardness of actually getting condoms.",
      components: [
        { model: "Perceived severity & susceptibility", name: "Statistics-led messaging", detail: "Posters and social content lead with real numbers — what a child actually costs to raise, local conception rates — so the risk feels personal rather than abstract." },
        { model: "Perceived barriers", name: "Free, discreet condom delivery", detail: "Order via the website or a poster's QR code and condoms arrive in plain packaging, at home or at a chosen parcel locker, at no cost." },
        { model: "Subjective norm (TPB)", name: "Deliberately shareable, funny campaign", detail: "Two poster tones — cheeky for clubs and pubs, calmer for schools and GP surgeries — plus comedic social ads are designed to become a talking point, so using condoms starts to look normal among mates, not the exception." }

  faqs: [
    {
      q: "Why target teenage boys specifically?",
      a: "Most existing campaigns and services focus on girls and young women — which makes sense given who carries a pregnancy, but leaves shared responsibility for contraception mostly unaddressed. We think that's a genuine gap: evidence on multi-component prevention shows effects are usually weaker for male participants, which suggests boys are being reached less effectively, not that they don't matter."
    },
    {
      q: "Is the free condom delivery actually real?",
      a: "No — this is a concept designed for a university assessment, not a working feature of this site. Nobody can order condoms here. For real, free and confidential contraception right now, see our Get Support tab, especially the Sexual Health Sheffield Youth Clinic."
    },
    {
      q: "Why two different posters?",
      a: "Tone needs to match location. The club/pub version leans into dark humour because that's what gets read (and remembered) on the back of a toilet door in a club. The school/GP version is calmer, because that audience includes staff, parents and younger students, not just the target group."
    },
    {
      q: "What is a 'conception rate'?",
      a: "It's the number of pregnancies per 1,000 women in an age group, over a year — it lets you compare areas of different sizes fairly. Our headline stat (35 vs 5 per 1,000) compares Firth Park and Fulwood using this measure."
    },
    {
      q: "Is anything on this site a substitute for medical advice?",
      a: "No — this site is for awareness and signposting only. For personal advice, please contact one of the confidential services in our Get Support tab."
    },
    {
      q: "Can I see the original poster files or suggest a correction?",
      a: "Yes — the posters were designed in Canva; use the contact form on the Get Involved tab to ask for the files or flag anything that needs fixing."
    }
  ],

/* ---------- citations ---------- */
function cite(id) {
  const ref = CONFIG.references.find(r => r.id === id);
  if (!ref) return `<span style="color:var(--status-critical);">[missing reference: ${escapeHtml(id)}]</span>`;
  return `<a href="#" class="cite-link" data-ref="${id}">${escapeHtml(ref.shortLabel)}</a>`;
}
function withCitations(str) {
  return escapeHtml(str).replace(/CITE:([a-zA-Z0-9_]+)/g, (_, id) => cite(id));
}
function wireCitationLinks(container) {
  (container || document).querySelectorAll('.cite-link').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      showPanel('references');
      setTimeout(() => {
        const el = document.getElementById('ref-' + a.dataset.ref);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('ref-highlight');
          setTimeout(() => el.classList.remove('ref-highlight'), 1600);
        }
      }, 60);
    });
  });
}

/* ---------- bar chart builder (shared) ---------- */
function buildBarChart(stats, unit, seriesColors) {
  const w = 640, h = 260, padL = 40, padR = 20, padT = 20, padB = 40;
  const max = Math.max(...stats.map(s => s.value)) * 1.15;
  const bw = (w - padL - padR) / stats.length * 0.5;
  const gap = (w - padL - padR) / stats.length;
  const yScale = v => (h - padB) - (v / max) * (h - padT - padB);
  let bars = '', labels = '';
  stats.forEach((s, i) => {
    const x = padL + gap * i + (gap - bw) / 2;
    const barTop = yScale(s.value);
    const barH = (h - padB) - barTop;
    const color = seriesColors[i % seriesColors.length];
    bars += `<rect class="bar-rect" x="${x}" y="${barTop}" width="${bw}" height="${barH}" rx="8" fill="${color}"
      data-value="${s.value}" data-cat="${escapeHtml(s.category)}"></rect>
      <text class="bar-value-label" x="${x + bw/2}" y="${barTop - 10}" text-anchor="middle">${s.value}</text>
      <text class="bar-cat-label" x="${x + bw/2}" y="${h - padB + 20}" text-anchor="middle">${escapeHtml(s.category)}</text>`;
  });
  const gridLines = [0, 0.25, 0.5, 0.75, 1].map(f => {
    const y = padT + (h - padT - padB) * (1 - f);
    return `<line x1="${padL}" x2="${w - padR}" y1="${y}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1"/>
      <text class="bar-axis-label" x="${padL - 8}" y="${y + 4}" text-anchor="end">${Math.round(max * f)}</text>`;
  }).join('');
  return `<svg class="bar-chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart: ${stats.map(s=>s.category+' '+s.value).join(', ')} (${unit})">
    ${gridLines}${bars}
  </svg>`;
}
function wireChartTooltip(root) {
  const svg = root.querySelector('.bar-chart-svg');
  const tip = root.querySelector('.chart-tooltip');
  if (!svg || !tip) return;
  svg.querySelectorAll('.bar-rect').forEach(rect => {
    rect.addEventListener('mousemove', e => {
      const bbox = root.getBoundingClientRect();
      tip.style.left = (e.clientX - bbox.left) + 'px';
      tip.style.top = (e.clientY - bbox.top) + 'px';
      tip.textContent = `${rect.dataset.cat}: ${rect.dataset.value}`;
      tip.classList.add('show');
    });
    rect.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}

/* ---------- lightbox ---------- */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbCaption = document.getElementById('lbCaption');
let lbIndex = 0;
function openLightbox(i) {
  lbIndex = i;
  renderLightbox();
  lightbox.dataset.open = 'true';
  lightbox.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('lbClose').focus();
}
function renderLightbox() {
  const item = GALLERY_IMAGES[lbIndex];
  if (!item) return;
  lbImg.src = item.image;
  lbImg.alt = item.alt;
  lbCaption.textContent = item.title + ' — ' + item.caption;
}
function closeLightbox() {
  lightbox.dataset.open = 'false';
  lightbox.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbScrim').addEventListener('click', closeLightbox);
document.getElementById('lbPrev').addEventListener('click', () => { lbIndex = (lbIndex - 1 + GALLERY_IMAGES.length) % GALLERY_IMAGES.length; renderLightbox(); });
document.getElementById('lbNext').addEventListener('click', () => { lbIndex = (lbIndex + 1) % GALLERY_IMAGES.length; renderLightbox(); });
document.addEventListener('keydown', e => {
  if (lightbox.dataset.open !== 'true') return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') document.getElementById('lbPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('lbNext').click();
});

/* ---------- interactive wiring shared across panels ---------- */
function initInteractiveBits(root) {
  // data-table toggles
  root.querySelectorAll('[data-toggle-table]').forEach(btn => {
    btn.addEventListener('click', () => {
      const wrap = document.getElementById(btn.dataset.toggleTable);
      wrap.classList.toggle('show');
      btn.textContent = wrap.classList.contains('show') ? 'Hide table' : 'View as table';
    });
  });
  // chart tooltip
  root.querySelectorAll('.chart-card').forEach(wireChartTooltip);
  // faq accordions
  root.querySelectorAll('[data-faq-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = btn.closest('.faq-item');
      const open = item.dataset.open === 'true';
      root.querySelectorAll('.faq-item').forEach(i => i.dataset.open = 'false');
      item.dataset.open = open ? 'false' : 'true';
    });
  });
  // poster gallery -> lightbox
  root.querySelectorAll('[data-lb-index]').forEach(el => {
    el.addEventListener('click', () => openLightbox(parseInt(el.dataset.lbIndex, 10)));
    el.setAttribute('tabindex', '0');
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', 'View full-size image');
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(parseInt(el.dataset.lbIndex, 10)); } });
  });
  // tracker gate
  const revealBtn = root.querySelector('#trackerRevealBtn');
  if (revealBtn) {
    revealBtn.addEventListener('click', () => {
      const area = root.querySelector('#trackerArea');
      area.innerHTML = renderTracker();
      wireTrackerForm(area);
      area.scrollIntoView({ behavior: 'smooth', block: 'center' });
      observeReveals();
    });
  }
  // count-up stats
  root.querySelectorAll('[data-countup]').forEach(el => { el._counted = false; });
}
function wireTrackerForm(area) {
  const submit = area.querySelector('#trackerSubmit');
  if (!submit) return;
  const tryUnlock = () => {
    const val = area.querySelector('#trackerPass').value;
    if (val === CONFIG.tracker.passcode) {
      trackerUnlocked = true;
      area.innerHTML = renderTracker();
      observeReveals();
    } else {
      area.querySelector('#trackerError').textContent = 'Wrong passcode — try again.';
    }
  };
  submit.addEventListener('click', tryUnlock);
  area.querySelector('#trackerPass').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
}

/* footer team link jumps to about + opens tracker */
document.getElementById('teamLink').addEventListener('click', () => {
  showPanel('about');
  setTimeout(() => {
    const btn = document.getElementById('trackerRevealBtn');
    if (btn) btn.click();
  }, 80);
});
document.getElementById('brandLink').addEventListener('click', (e) => { e.preventDefault(); showPanel('home'); });

/* ---------- scroll reveal (IntersectionObserver) ---------- */
let revealObserver;
function observeReveals() {
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => el.classList.add('in-view'));
    animateCountUps();
    return;
  }
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.reveal, .reveal-stagger').forEach(el => revealObserver.observe(el));
  animateCountUps();
}

/* ---------- count-up numbers for home stat tiles ---------- */
function animateCountUps() {
  const tiles = document.querySelectorAll('[data-countup]');
  if (!tiles.length || !('IntersectionObserver' in window)) return;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting && !entry.target._counted) {
        entry.target._counted = true;
        const el = entry.target.querySelector('.value');
        const raw = entry.target.dataset.countup;
        const match = raw.match(/(\d+(?:\.\d+)?)/);
        if (match && !prefersReducedMotion()) {
          const num = parseFloat(match[1]);
          const suffix = raw.replace(match[1], '');
          const start = performance.now();
          const dur = 900;
          function tick(now) {
            const p = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - p, 3);
            el.textContent = (Math.round(num * eased * 10) / 10) + suffix;
            if (p < 1) requestAnimationFrame(tick);
            else el.textContent = raw;
          }
          requestAnimationFrame(tick);
        }
        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.4 });
  tiles.forEach(t => obs.observe(t));
}
function prefersReducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

/* ---------- init ---------- */
const initialTab = (location.hash || '#home').replace('#', '');
showPanel(TABS.some(t => t.id === initialTab) ? initialTab : 'home');
